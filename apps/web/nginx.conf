server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # API detrás del mismo origen: sin CORS en producción.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    # S3 de desarrollo: mismo origen para evitar CORS. El Host debe coincidir
    # con el endpoint interno firmado por la API.
    location /s3/ {
        proxy_pass http://storage:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host storage:9000;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 10m;
    }

    # SPA: cualquier ruta desconocida vuelve a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con caché larga (Vite los versiona por hash).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
