server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # Resolver interno de Docker: evita conservar la IP vieja del API o del
    # storage cuando un contenedor se recrea (p. ej. al recompilar la API).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API detrás del mismo origen: sin CORS en producción.
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
    }

    location = /health {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
    }

    # S3 de desarrollo: mismo origen para evitar CORS. El Host debe coincidir
    # con el endpoint interno firmado por la API.
    location /s3/ {
        set $storage_upstream http://storage:9000;
        rewrite ^/s3/(.*)$ /$1 break;
        proxy_pass $storage_upstream$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host storage:9000;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 10m;
    }

    # SPA: cualquier ruta desconocida vuelve a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con caché larga (Vite los versiona por hash).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
