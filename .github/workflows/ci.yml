name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API y contrato
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: issitek
          POSTGRES_PASSWORD: issitek
          POSTGRES_DB: issitek_test
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U issitek -d issitek_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://issitek:issitek@localhost:5433/issitek_test
      MINIO_ENDPOINT: localhost:9100
      MINIO_ACCESS_KEY: issitek
      MINIO_SECRET_KEY: issitek-secret
      MINIO_PUBLIC_ENDPOINT: ""
      TTS_PROVIDER: fake
      PRONUNCIATION_EVAL_ENABLED: "false"
      JWT_SECRET: ci-secret-no-usar-en-produccion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/api/requirements.txt
            services/api/requirements-dev.txt
      - name: Dependencias
        working-directory: services/api
        run: pip install -r requirements-dev.txt
      - name: OpenAPI sin drift
        working-directory: services/api
        run: |
          python scripts/export_openapi.py
          git diff --exit-code ../../packages/shared/openapi.json
      - name: Almacenamiento S3 de desarrollo
        run: |
          nohup moto_server -H 127.0.0.1 -p 9100 >/tmp/moto.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9100/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/moto.log
          exit 1
      - name: Migración inicial
        working-directory: services/api
        run: alembic upgrade head
      - name: Ida y vuelta de migraciones
        working-directory: services/api
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Pruebas
        working-directory: services/api
        run: pytest -q

  frontend:
    name: Web (tipos y build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Dependencias
        run: pnpm install --frozen-lockfile
      - name: Tipos
        run: pnpm typecheck
      - name: OpenAPI TypeScript sin drift
        run: |
          pnpm shared:generate
          git diff --exit-code packages/shared/src/openapi.d.ts
      - name: Build
        run: pnpm build

  e2e:
    name: E2E navegador (micrófono sintético)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Dependencias
        run: pnpm install --frozen-lockfile
      - name: Navegador Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Levantar stack
        run: docker compose -f infra/docker-compose.yml up -d --build
      - name: Esperar API y web
        run: |
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:8090/health >/dev/null && curl -fsS http://localhost:8090/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f infra/docker-compose.yml logs --tail=200
          exit 1
      - name: Playwright
        run: pnpm test:e2e
      - name: Logs si falla
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail=300
      - name: Bajar stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
