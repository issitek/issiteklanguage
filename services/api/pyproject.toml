[project]
name = "issitek-api"
version = "0.1.0"
description = "API de Issitek Language (talkdrill.com)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy==2.0.36",
  "psycopg[binary]==3.2.3",
  "alembic==1.14.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "PyJWT==2.10.1",
  "argon2-cffi==23.1.0",
  "minio==7.2.12",
  "httpx==0.28.1",
  "email-validator==2.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
