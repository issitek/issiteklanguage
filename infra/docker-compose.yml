name: issitek-language

services:
  postgres:
    image: postgres:16-alpine
    container_name: issitek-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-issitek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-issitek}
      POSTGRES_DB: ${POSTGRES_DB:-issitek_language}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - issitek_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-issitek} -d ${POSTGRES_DB:-issitek_language}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: issitek-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - issitek_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible de desarrollo. MinIO OSS está archivado y ya no se
  # distribuye; el cliente de la API habla S3, así que en producción se apunta
  # a MinIO/Garage/SeaweedFS/S3 cambiando MINIO_ENDPOINT.
  storage:
    build:
      context: ../services/storage-dev
    container_name: issitek-storage
    ports:
      - "${MINIO_API_PORT:-9100}:9000"

  api:
    build:
      context: ../services/api
    container_name: issitek-api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-issitek}:${POSTGRES_PASSWORD:-issitek}@postgres:5432/${POSTGRES_DB:-issitek_language}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-storage:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:8090/s3}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-issitek}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-issitek-secret}
      TTS_PROVIDER: ${TTS_PROVIDER:-fake}
      TTS_LOCAL_URL: ${TTS_LOCAL_URL:-http://host.docker.internal:9082}
      PRONUNCIATION_EVAL_ENABLED: ${PRONUNCIATION_EVAL_ENABLED:-false}
      RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-30}
      UVICORN_RELOAD: ${UVICORN_RELOAD:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ../services/api:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: issitek-web
    ports:
      - "${WEB_PORT:-8090}:80"
    depends_on:
      - api
      - storage

  worker:
    build:
      context: ../services/api
    container_name: issitek-worker
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-issitek}:${POSTGRES_PASSWORD:-issitek}@postgres:5432/${POSTGRES_DB:-issitek_language}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-storage:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-issitek}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-issitek-secret}
      RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-30}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-3600}
      WORKER_RUN_ONCE: ${WORKER_RUN_ONCE:-false}
    command: ["python", "-m", "app.worker"]
    volumes:
      - ../services/api:/app
    depends_on:
      api:
        condition: service_healthy
      storage:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,time; p=os.environ.get('WORKER_HEARTBEAT_PATH','/tmp/issitek-worker-heartbeat'); assert time.time()-os.path.getmtime(p) < 120",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  issitek_pgdata:
    name: issitek_pgdata
  issitek_redis:
    name: issitek_redis

networks:
  default:
    name: issitek_net
